<div align="center">
    <input style="margin-left: 20px;" type="checkbox" [(ngModel)]="filter.paginate" (ngModelChange)="filterChange()" />Paginate
    <input style="margin-left: 20px;" type="checkbox" [(ngModel)]="filter.withSections" (ngModelChange)="filterChange()" />With Sections 
    <input style="margin-left: 20px;" type="checkbox" [(ngModel)]="filter.other" (ngModelChange)="filterChange()" /> Other
</div>

<div class="text-center mt-3 scripture-styles">
   
    <!-- translations combobox -->
    <select #ts [(ngModel)]="selectedTranslation" (change)="onTranslationChanged()">
        <option *ngFor="let trans of translations" [ngValue]='trans' [selected]="trans.translationId == 'v1805-T' "
                 title="{{trans.translationId}}" >
            {{trans.name}}
        </option>
    </select>

    <button [disabled]="(selectedChapter <= 1)"
            style="margin-left: 10pt; margin-right: 10pt" (click)="onPrev()">prev</button>

    <!-- books combobox -->
    <select #bs [(ngModel)]="selectedBook" (change)="onBookChanged()">
        <option *ngFor="let book of translationBooks" [ngValue]='book'>
                {{book.bookOrder}} - {{book.book}} -{{book.chapterCount}} -({{book.verseCount}}) {{book.abbrebiations}}
        </option>
    </select>

    <!-- <option *ngFor="let book of translationBooks" [ngValue]="book">
        {{ book.book }}
    </option> -->

    <!-- chapters combbox -->
    <select #ch [(ngModel)]="selectedChapter" (change)="onChapterChanged()">
        <option *ngFor="let chapter of chapterNums" [ngValue]='chapter'>
            {{chapter}}
        </option>
    </select>

    <button [disabled]="(selectedChapter >= selectedBook.chapterCount)"
            style="margin-left: 10pt; margin-right: 10pt" (click)="onNext()">next</button>

    <!-- <button type="button" class="btn btn-primary" [(ngModel)]="paginationMode" btnCheckbox

    <!-- this approach keep verse order, WORKS!!! -->
    <div class="verse" *ngFor='let key of objectKeys(groupedVerses)'>

        <br/>
        <br/>
        <p *ngFor='let verse of groupedVerses[key]'><sup class="v">{{verse.verse}}</sup> {{verse.verseText}} </p>
     </div>
