
<div class="text-center mt-3">
   
    <select #ts [(ngModel)]="selectedTranslation" (change)="onTranslationChanged(ts.value)">
        <option *ngFor="let trans of translations"         
                 value={{trans.translationId}} [selected]="trans.translationId == 'v1805-T' ">
            {{trans.translationId}}</option>
    </select>

    <select #bs [(ngModel)]="selectedBook" (change)="onBookChanged(bs.value)">
        <option *ngFor="let book of translationBooks" 
         value={{book.book}}>{{book.bookOrder}} - {{book.book}}</option>
    </select>

    <select #ch [(ngModel)]="selectedChapter" (change)="onChapterChanged(ch.value)">
        <option *ngFor="let chapter of chapterNums" 
         value={{chapter}}>{{chapter}}</option>
    </select>
    <button type="button" class="btn btn-primary"
    [(ngModel)]="paginationMode" btnCheckbox
    (click)="onBookChanged(bs.value)"
    btnCheckboxTrue="Paginate" btnCheckboxFalse="NoPages">
    {{paginationMode}}
</button>

<label>{{verseCount}}</label>



    <!-- <select #vs (change)="onVerseChanged(vs.value)">
        <option *ngFor="let verse of verseNums" 
         value={{verse}}>{{verse}}</option>
    </select> -->

    <div id="main">
        <p *ngFor="let verse of verses"><sup>{{verse.verse}}</sup> {{verse.verseText}} </p>
    </div>

    <!-- <div id="main">
        <p *ngFor="let group of sectionTitles">{{group}} 
            <p *ngFor="let verse of groupedVerses[group]">{{verse]}} 
        </p>
    </div>  -->


    <div class="d-flex justify-content-center" *ngIf="versePagination">
        <pagination 
            [boundaryLinks]="true" 
            [totalItems]="versePagination.totalItems"
            [itemsPerPage]="versePagination.itemsPerPage"
            [(ngModel)]="versePagination.currentPage"
            (pageChanged)="onVersePaginationPageChanged($event)"
            [maxSize]="10"
            previousText="&lsaquo;" 
            nextText="&rsaquo;" 
            firstText="&laquo;"
            lastText="&raquo;">
    </pagination>
    </div>
