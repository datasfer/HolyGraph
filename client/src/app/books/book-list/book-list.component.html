<div class="text-center mt-3">

    <select #ts (change)="selectItem(ts.value)">
        <option *ngFor="let trans of translations" 
        
        value={{trans.translationId}}>{{trans.translationId}}</option>
    </select>

    <select #bs (change)="onTranslationChanged(bs.value)">
        <option *ngFor="let book of translationBooks" 
        
        value={{book.book}}>{{book.book}}</option>
    </select>

    <h2>Books - {{pagination?.totalItems}} found</h2>
    <ul>
        <li *ngFor="let book of books">{{book.translationId}} | {{book.bookOrder}} | {{book.book}} - {{book.title}}</li>
    </ul>


    <div class="d-flex justify-content-center" *ngIf="pagination">
        <pagination 
            [boundaryLinks]="true" 
            [totalItems]="pagination.totalItems"
            [itemsPerPage]="pagination.itemsPerPage"
            [(ngModel)]="pagination.currentPage"
            (pageChanged)="pageChanged($event)"
            [maxSize]="10"
            previousText="&lsaquo;" 
            nextText="&rsaquo;" 
            firstText="&laquo;"
            lastText="&raquo;">
    </pagination>
    </div>

</div>
