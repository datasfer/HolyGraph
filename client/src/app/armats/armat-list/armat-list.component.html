<table width="100%">
    <tbody>
        <tr>
            <td style="font-size:18px;" align="center" >
                <div  class="block" *ngFor="let letter of letters"> 
                    <a  [routerLink]="['/', 'armats', letter.toUpperCase()]"
                    (click)='onGoToArmatsStartsWith(letter.toUpperCase())' 
                    style="margin-right: 10px; cursor: pointer;">{{letter.toUpperCase()}}</a>
                    <a [routerLink]="['/', 'armats', letter]" 
                    (click)='onGoToArmatsStartsWith(letter)' 
                        style="margin-right: 10px;" >{{letter}}</a>
                </div>
                
            </td>
        </tr>
    </tbody>
</table>

<div *ngFor="let armat of armats">
    <ul>
        <li><a  routerLink="/armat-tokens/{{armat.armat}}">{{armat.armat}}</a></li>
    </ul>
</div>


<div class="d-flex justify-content-center" *ngIf="armatPagination">
    <pagination 
        [boundaryLinks]="true" 
        [totalItems]="armatPagination.totalItems"
        [itemsPerPage]="armatPagination.itemsPerPage"
        [(ngModel)]="armatPagination.currentPage"
        (pageChanged)="onArmatPaginationPageChanged($event)"
        [maxSize]="10"
        previousText="&lsaquo;" 
        nextText="&rsaquo;" 
        firstText="&laquo;"
        lastText="&raquo;">
</pagination>
</div>
