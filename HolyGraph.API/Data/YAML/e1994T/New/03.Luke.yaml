      sectionTitles: [ՆԱԽԱԲԱՆ, ՅՈՎՀԱՆՆԷՍ ՄԿՐՏՉԻ ԾՆՆԴԵԱՆ ԱՒԵՏՈՒՄԸ,ՅԻՍՈՒՍԻ ԾՆՆԴԵԱՆ ԱՒԵՏՈՒՄԸ,ՄԱՐԻԱՄԻ ԱՅՑԵԼՈՒԹԻՒՆԸ ԵՂԻՍԱԲԵԹԻՆ,ՄԱՐԻԱՄԻ ՕՐՀՆԵՐԳՈՒԹԻՒՆԸ,ՅՈՎՀԱՆՆԷՍ ՄԿՐՏՉԻ ԾՆՈՒՆԴԸ ԵՒ ԹԼՓԱՏՈՒՄԸ,ԶԱՔԱՐԻԱՅԻ ՕՐՀՆԵՐԳՈՒԹԻՒՆԸ]
